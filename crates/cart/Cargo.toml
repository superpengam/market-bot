[package]
name = "market-bot-cart"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
market-bot-catalog = { path = "../catalog" }
market-bot-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
