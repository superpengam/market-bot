  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
    UserId:
      name: X-User-Id
      in: header
      description: Optional caller UUID. When omitted, a well-known test user is used.
      schema:
        type: string
        format: uuid
    AiAuthorizationId:
      name: X-Ai-Authorization-Id
      in: header
      required: true
      description: UUID of an AI authorization previously issued to the client.
      schema:
        type: string
        format: uuid
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: Admin token in the form admin/{user_id}
    userBearer:
      type: http
      scheme: bearer
      description: User token in the form user/{user_id}
  responses:
    InvalidInput:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller is authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
