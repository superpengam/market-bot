[package]
name = "market-bot-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "market_bot_api"
path = "src/lib.rs"

[[bin]]
name = "market-bot-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
market-bot-ai-agent = { path = "../../crates/ai_agent" }
market-bot-cart = { path = "../../crates/cart" }
market-bot-catalog = { path = "../../crates/catalog" }
market-bot-moderation = { path = "../../crates/moderation" }
market-bot-order = { path = "../../crates/order" }
market-bot-payment = { path = "../../crates/payment" }
market-bot-search = { path = "../../crates/search" }
market-bot-seller = { path = "../../crates/seller" }
market-bot-shared = { path = "../../crates/shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
http-body-util = "0.1"
