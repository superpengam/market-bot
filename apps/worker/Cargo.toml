[package]
name = "market-bot-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "market-bot-worker"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
market-bot-fulfillment = { path = "../../crates/fulfillment" }
market-bot-order = { path = "../../crates/order" }
market-bot-payment = { path = "../../crates/payment" }
market-bot-shared = { path = "../../crates/shared" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"
